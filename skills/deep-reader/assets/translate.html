<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜中英對照</title>
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf9; --ink:#1d2127; --muted:#6a6f78; --line:#e3ded2;
  --accent:#2e5c8a; --accent-ink:#fff; --hover:#fbf3dd; --tn:#8a5a14;
  --font-en:"Charter","Iowan Old Style","Palatino Linotype","Georgia","Times New Roman",serif;
  --font-zh:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --font-ui:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171b; --paper:#1c1f24; --ink:#e7e6e1; --muted:#9aa0a9; --line:#2d3139;
    --accent:#86b3e0; --accent-ink:#10151c; --hover:#262418; --tn:#e0b56e; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(0,0,0,.04)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.doc-title{flex:1;min-width:180px;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.controls button{font:inherit;font-size:13px;line-height:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 11px;border-radius:7px;cursor:pointer}
.controls button:hover{border-color:var(--accent)}
.controls button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls .sep{width:1px;height:20px;background:var(--line);margin:0 4px}

/* cover */
.cover{max-width:1400px;margin:0 auto;padding:40px 24px 20px}
.cover .en-title{font-family:var(--font-en);font-size:clamp(26px,4vw,40px);line-height:1.2;margin:0 0 6px;font-weight:600}
.cover .zh-title{font-family:var(--font-zh);font-size:clamp(20px,3vw,28px);margin:0 0 12px;color:var(--ink)}
.cover .meta{color:var(--muted);font-size:14px;margin:0 0 12px}
.cover .summary{max-width:860px;font-size:15px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;margin:0}

/* document */
.doc{max-width:1400px;margin:0 auto;padding:12px 24px 40px}
.col-head{display:grid;grid-template-columns:1fr 1fr;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink);background:var(--paper);border-radius:10px 10px 0 0}
.col-head span{padding:10px 22px}
.col-head span+span{border-left:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-bottom:1px solid var(--line);position:relative;scroll-margin-top:70px;transition:background .15s}
.pair:hover,.pair:target{background:var(--hover)}
.pair>.en,.pair>.zh{padding:14px 22px;min-width:0}
.pair>.en{font-family:var(--font-en);font-size:var(--fs);line-height:1.7;border-right:1px solid var(--line);hyphens:auto}
.pair>.zh{font-family:var(--font-zh);font-size:calc(var(--fs) - 0.5px);line-height:1.9;text-align:justify}
.pair p{margin:0}
.pair p+p{margin-top:.7em}
.pair[data-p]::before{content:"¶" attr(data-p);position:absolute;left:-2px;top:16px;transform:translateX(-100%);font-size:11px;color:var(--muted);font-family:var(--font-ui);padding-right:6px}
.pair.h>div{padding-top:26px;padding-bottom:10px}
.pair.h h2,.pair.h h3{margin:0;font-size:calc(var(--fs) + 3px);line-height:1.35}
.pair.h .zh h2,.pair.h .zh h3{font-family:var(--font-zh)}
.pair.quote blockquote{margin:0;padding-left:14px;border-left:3px solid var(--line);font-style:italic}
.pair.quote .zh blockquote{font-style:normal}
.pair.figure>div{font-size:calc(var(--fs) - 2px);color:var(--muted)}
.pair ul,.pair ol{margin:0;padding-left:1.4em}
.tn{color:var(--tn);font-size:.88em;font-family:var(--font-ui)}

/* view modes */
body.view-en .pair,body.view-zh .pair,body.view-en .col-head,body.view-zh .col-head{grid-template-columns:1fr;max-width:860px;margin-left:auto;margin-right:auto}
body.view-en .pair>.zh,body.view-en .col-head span+span{display:none}
body.view-zh .pair>.en,body.view-zh .col-head span:first-child{display:none}
body.view-en .pair>.en{border-right:0}
body.view-zh .col-head span+span{border-left:0}

/* glossary & references */
.glossary,.references{max-width:1400px;margin:0 auto 24px;padding:0 24px}
.glossary h2{font-size:18px}
.glossary table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.glossary th,.glossary td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.glossary th{font-size:12px;color:var(--muted);letter-spacing:.05em}
.glossary td:first-child{font-family:var(--font-en);font-style:italic;white-space:nowrap}
details.references{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0}
details.references summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.references ol,details.references ul{font-family:var(--font-en);font-size:14px;padding:0 24px 16px 44px;margin:0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 40px}

@media (max-width:760px){
  .topbar-inner,.cover,.doc,.glossary,.references{padding-left:16px;padding-right:16px}
  .col-head{display:none}
  .pair{grid-template-columns:1fr}
  .pair>.en{border-right:0;border-bottom:1px dashed var(--line)}
  .pair>.en,.pair>.zh{padding:12px 14px}
  .pair[data-p]::before{position:static;transform:none;display:block;padding:8px 14px 0}
  .glossary td:first-child{white-space:normal}
}
@media print{
  .topbar{position:static;box-shadow:none}
  .controls{display:none}
  body{background:#fff}
  .pair{break-inside:avoid}
  details.references{display:block}
}
</style>
</head>
<body>
{{BODY}}
<script>
(function(){
  var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  var root=document.documentElement,body=document.body;
  function setView(v){
    body.classList.remove('view-en','view-zh');
    if(v==='en'||v==='zh')body.classList.add('view-'+v);
    document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-view')===v))});
    store.set('dr-view',v);
  }
  function setFont(px){px=Math.max(13,Math.min(26,px));root.style.setProperty('--fs',px+'px');store.set('dr-fs',String(px))}
  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-view'))setView(b.getAttribute('data-view'));
    if(b.hasAttribute('data-font')){var cur=parseFloat(getComputedStyle(root).getPropertyValue('--fs'))||17;setFont(cur+Number(b.getAttribute('data-font')))}
  });
  var v=store.get('dr-view');if(v)setView(v);
  var fs=store.get('dr-fs');if(fs)setFont(Number(fs));
})();
</script>
</body>
</html>
