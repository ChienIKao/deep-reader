<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Annotated Reading</title>
<style>
:root{
  --bg:#f5f3ee; --paper:#fffdf9; --ink:#1d2127; --muted:#697079; --line:#e2ddd1; --accent:#2e5c8a;
  --font-en:"Charter","Iowan Old Style","Palatino Linotype","Georgia","Times New Roman",serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --tint-a:.16;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171b; --paper:#1c1f24; --ink:#e7e6e1; --muted:#9aa0a9; --line:#2d3139; --accent:#86b3e0; --tint-a:.28; }
}
/* question palette: --c = solid, --t = tint */
.q0{--c:#7b818a}
.q1{--c:#2f6db5}
.q2{--c:#d9731a}
.q3{--c:#2e9150}
.q4{--c:#8a4fc4}
.q5{--c:#cf3e57}
.q6{--c:#138a8a}
.q7{--c:#a8841a}
.q8{--c:#5a6b9e}
.q0,.q1,.q2,.q3,.q4,.q5,.q6,.q7,.q8{--t:color-mix(in srgb,var(--c) calc(var(--tint-a)*100%),transparent)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(0,0,0,.05)}
.topbar-inner{max-width:1440px;margin:0 auto;padding:10px 24px 6px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{flex:1;min-width:220px}
.doc-title{font-weight:700;font-size:16px;line-height:1.3}
.course{font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:13px;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:7px}
.nav a:hover{background:var(--bg)}
.legend{max-width:1440px;margin:0 auto;padding:4px 24px 10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c);background:var(--t);color:var(--ink);padding:3px 10px 3px 4px;border-radius:999px;cursor:pointer;transition:opacity .15s}
.chip b{background:var(--c);color:#fff;border-radius:999px;padding:1px 7px;font-size:11.5px}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c)}
body.focusing .chip[aria-pressed="false"]{opacity:.45}

/* tags */
.tag{display:inline-block;background:var(--c);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:5px;line-height:1.5;white-space:nowrap}

/* overview */
.overview{max-width:1440px;margin:0 auto;padding:32px 24px 12px}
.overview h1{font-family:var(--font-en);font-size:clamp(24px,3.6vw,36px);line-height:1.2;margin:0 0 12px}
.overview h1 small{display:block;font-family:var(--font-body);font-size:.6em;color:var(--muted);font-weight:500;margin-top:4px}
.gist{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;max-width:920px;margin:0 0 16px}
.questions{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:1100px}
.questions li{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:9px 14px;font-size:14.5px}
.questions .zh,.questions .orig{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}

/* reading columns */
.reading{max-width:1440px;margin:0 auto;padding:16px 24px 32px}
.col-head{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink);background:var(--paper);border-radius:10px 10px 0 0}
.col-head span{padding:10px 22px}
.col-head span+span{border-left:1px solid var(--line)}
.pair{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:var(--paper);border-bottom:1px solid var(--line);scroll-margin-top:120px}
.pair:target{outline:2px solid var(--accent);outline-offset:-2px}
.src{padding:16px 22px;border-right:1px solid var(--line);font-family:var(--font-en);font-size:16.5px;line-height:1.75;position:relative}
.src p{margin:0}
.src p+p,.src blockquote+p,.src p+blockquote{margin-top:.7em}
.src blockquote{margin:0;padding-left:14px;border-left:3px solid var(--line);font-style:italic}
.src ul,.src ol{margin:.4em 0 0;padding-left:1.4em}
.pno{display:inline-block;font-family:var(--font-ui);font-size:11px;color:var(--muted);margin-bottom:4px}
.notes{padding:12px 16px;background:color-mix(in srgb,var(--bg) 55%,var(--paper));display:flex;flex-direction:column;gap:10px}
.pair.h .src,.pair.h .notes{padding-top:26px;padding-bottom:10px}
.pair.h h2{margin:0;font-size:19px;line-height:1.35}
.pair.h .notes h2{font-family:var(--font-body)}

mark{background:var(--t);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--c);transition:background .15s,box-shadow .15s}
mark:not([class]){--c:#c9a227;--t:rgba(201,162,39,.25)}

.note{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;font-family:var(--font-body);font-size:14px;line-height:1.7;transition:opacity .15s}
.note .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.note dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.note dt{font-weight:700;color:var(--c);font-size:12.5px;padding-top:2px;white-space:nowrap}
.note dd{margin:0}
.note.q0{border-left-style:dashed}

/* focus mode */
body.focusing mark:not(.is-focus){background:transparent;box-shadow:none}
body.focusing .note:not(.is-focus){opacity:.35}
body.focusing .answer:not(.is-focus){opacity:.4}

/* worksheet */
.worksheet{max-width:1440px;margin:0 auto;padding:24px 24px 16px;scroll-margin-top:110px}
.worksheet>h2{font-size:22px;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.answer{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:16px 18px;font-family:var(--font-body);font-size:14.5px;line-height:1.75;scroll-margin-top:120px;transition:opacity .15s}
.answer header{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.answer header .tag{font-size:13px;margin-top:3px}
.answer h3{margin:0;font-size:16px;line-height:1.45;font-family:var(--font-en)}
.answer h3 small{display:block;font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:13.5px}
.answer .block{margin-top:10px}
.answer h4{margin:0 0 4px;font-size:13px;color:var(--c);letter-spacing:.03em}
.answer h4::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:1px}
.answer p{margin:0}
.answer ul{margin:0;padding-left:1.2em}
.answer li{margin:3px 0}
.answer q{font-family:var(--font-en);font-style:italic;background:var(--t);padding:0 3px;border-radius:3px}
.answer .counter{background:color-mix(in srgb,var(--c) 6%,transparent);border-radius:6px;padding:8px 10px}
.answer .links{margin-top:10px;font-size:12.5px;color:var(--muted)}
.answer .links a,.answer li a{font-family:var(--font-ui);font-size:12px;text-decoration:none;border:1px solid var(--line);padding:0 5px;border-radius:4px;white-space:nowrap}

.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 40px}

@media (max-width:900px){
  .answers{grid-template-columns:1fr}
}
@media (max-width:760px){
  .topbar-inner,.legend,.overview,.reading,.worksheet{padding-left:16px;padding-right:16px}
  .col-head{display:none}
  .pair{grid-template-columns:1fr}
  .src{border-right:0;border-bottom:1px dashed var(--line);padding:14px}
  .notes{padding:12px 14px}
  .note dl{grid-template-columns:1fr}
}
@media print{
  .topbar{position:static;box-shadow:none}
  .nav{display:none}
  body{background:#fff}
  .pair,.answer{break-inside:avoid}
}
</style>
</head>
<body>
{{BODY}}
<script>
(function(){
  var body=document.body,current=null;
  function focusQ(q){
    current=(current===q)?null:q;
    body.classList.toggle('focusing',!!current);
    document.querySelectorAll('.chip[data-q]').forEach(function(c){c.setAttribute('aria-pressed',String(current!==null&&c.getAttribute('data-q')===current))});
    document.querySelectorAll('mark,.note,.answer').forEach(function(el){el.classList.toggle('is-focus',!!current&&el.classList.contains(current))});
    if(current){var first=document.querySelector('mark.'+current+',.note.'+current);if(first)first.scrollIntoView({behavior:'smooth',block:'center'})}
  }
  document.querySelectorAll('.chip[data-q]').forEach(function(c){c.setAttribute('aria-pressed','false')});
  document.addEventListener('click',function(e){
    var chip=e.target.closest('.chip[data-q]');
    if(chip){focusQ(chip.getAttribute('data-q'));return}
    var tag=e.target.closest('.note .tag');
    if(tag){var m=(tag.className.match(/\bq([1-8])\b/)||[])[1];var a=m&&document.getElementById('a-q'+m);if(a)a.scrollIntoView({behavior:'smooth',block:'start'})}
  });
  document.querySelectorAll('.note .tag').forEach(function(t){if(/\bq[1-8]\b/.test(t.className)){t.style.cursor='pointer';t.title='Jump to this question's answer'}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&current)focusQ(current)});
})();
</script>
</body>
</html>
