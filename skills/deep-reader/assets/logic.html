<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜邏輯梳理</title>
<style>
:root{
  --bg:#f4f3ef; --paper:#fffdf9; --ink:#1d2127; --muted:#697079; --line:#e1dccf; --accent:#2e5c8a;
  --claim:#2e5c8a; --reason:#2e8a55; --evidence:#b7791f; --assumption:#7a57b8; --objection:#c2410c; --response:#0f766e;
  --font-en:"Charter","Iowan Old Style","Palatino Linotype","Georgia","Times New Roman",serif;
  --font-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171b; --paper:#1c1f24; --ink:#e7e6e1; --muted:#9aa0a9; --line:#2e323a; --accent:#86b3e0;
    --claim:#7fb0e6; --reason:#6cc794; --evidence:#e2b35c; --assumption:#b39ae6; --objection:#f0875a; --response:#5cc9bd; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-zh);line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h2{font-size:22px;margin:0 0 16px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
h3{font-size:17px;margin:0 0 8px}
h4{font-size:13px;margin:0 0 4px;color:var(--muted);letter-spacing:.04em}
p{margin:0}
p+p{margin-top:.6em}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(0,0,0,.05)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{flex:1;min-width:220px}
.doc-title{font-weight:700;font-size:16px;line-height:1.3}
.sub{font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:13px;text-decoration:none;color:var(--ink);padding:6px 9px;border-radius:7px}
.nav a:hover,.nav a.active{background:var(--bg)}

.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 24px;display:flex;flex-direction:column;gap:40px}
.wrap>section{scroll-margin-top:80px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px}

/* thesis */
.thesis{border-top:5px solid var(--claim)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--claim);font-weight:700;margin-bottom:8px}
.thesis blockquote.en{font-family:var(--font-en);font-size:clamp(18px,2.4vw,23px);line-height:1.5;margin:0 0 10px;padding-left:16px;border-left:3px solid var(--claim)}
.thesis cite,.ref{font-family:var(--font-ui);font-style:normal;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.thesis .zh{font-size:16.5px;margin-bottom:10px}
.plain{background:color-mix(in srgb,var(--claim) 8%,transparent);border-radius:8px;padding:10px 14px}
.meta-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.meta-grid>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--claim);color:var(--claim);border-radius:999px;padding:0 9px;margin:2px 4px 2px 0}

/* argument map */
.map-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.node-key{font-size:12.5px;padding:2px 10px;border-radius:6px;border:1.5px solid var(--k);color:var(--k);background:color-mix(in srgb,var(--k) 8%,var(--paper))}
.node-key.assumption{border-style:dashed}
.claim{--k:var(--claim)} .reason{--k:var(--reason)} .evidence{--k:var(--evidence)}
.assumption{--k:var(--assumption)} .objection{--k:var(--objection)} .response{--k:var(--response)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:22px;padding-left:22px;border-left:2px solid var(--line)}
.tree li{position:relative;padding-top:10px}
.tree ul>li::before{content:"";position:absolute;left:-22px;top:32px;width:20px;border-top:2px solid var(--line)}
.tree ul>li:last-child::after{content:"";position:absolute;left:-24px;top:34px;bottom:0;border-left:4px solid var(--bg)}
.node{position:relative;background:var(--paper);border:1.5px solid var(--k);border-left-width:5px;border-radius:9px;padding:9px 14px 10px;max-width:760px;font-size:14.5px;cursor:default}
.node.assumption{border-style:dashed;border-left-style:solid}
.node .kind{display:inline-block;font-size:11.5px;font-weight:700;color:var(--k);letter-spacing:.04em;margin-right:6px}
.node p{display:inline}
.node .ref{margin-left:6px}
.node.claim{background:color-mix(in srgb,var(--claim) 7%,var(--paper))}
.node.has-kids>.kind::after{content:" ▾";font-weight:400;color:var(--muted)}
li.collapsed>ul{display:none}
li.collapsed>.node>.kind::after{content:" ▸"}
.node.has-kids{cursor:pointer}

/* flow */
.flow{list-style:none;margin:0;padding:0;counter-reset:step}
.step{display:grid;grid-template-columns:92px 1fr;gap:16px;position:relative;padding-bottom:18px}
.step:not(:last-child)::after{content:"";position:absolute;left:45px;top:40px;bottom:0;border-left:2px dashed var(--line)}
.step .range{counter-increment:step;font-family:var(--font-ui);font-size:12.5px;color:var(--muted);text-align:center;padding-top:6px}
.step .range::before{content:counter(step);display:block;margin:0 auto 4px;width:28px;height:28px;line-height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px}
.step .body{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.signpost{font-size:13px;color:var(--muted);margin-top:6px}
.signpost em{font-family:var(--font-en);color:var(--ink);background:color-mix(in srgb,var(--evidence) 18%,transparent);padding:0 4px;border-radius:3px}

/* toulmin */
.toulmin{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.toulmin+.toulmin{margin-top:16px}
.t-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.t{border-radius:8px;padding:10px 12px;font-size:14px;border-top:3px solid var(--k);background:color-mix(in srgb,var(--k) 6%,var(--paper))}
.t h4{color:var(--k)}
.t.claim{--k:var(--claim)} .t.grounds{--k:var(--evidence)} .t.warrant{--k:var(--assumption)}
.t.backing{--k:var(--reason)} .t.qualifier{--k:var(--muted)} .t.rebuttal{--k:var(--objection)}

/* check */
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.check-grid ul,.card ul{margin:0;padding-left:1.2em}
.check-grid li{margin:4px 0;font-size:14.5px}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);letter-spacing:.05em;background:color-mix(in srgb,var(--bg) 50%,var(--paper))}
.strength{margin-bottom:16px}
.dots{white-space:nowrap;letter-spacing:2px;color:var(--evidence);font-size:15px}
.steelman{border-left:5px solid var(--objection)}
.concepts td:first-child b{font-family:var(--font-en)}

/* self check */
details{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 16px;margin-bottom:8px}
details summary{cursor:pointer;padding:12px 0;font-weight:600}
details>*:not(summary){padding-bottom:12px}

.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 16px 40px}

@media (max-width:860px){
  .meta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .check-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .topbar-inner,.wrap{padding-left:16px;padding-right:16px}
  .meta-grid,.t-grid{grid-template-columns:1fr}
  .tree ul{margin-left:8px;padding-left:14px}
  .tree ul>li::before{left:-14px;width:12px}
  .tree ul>li:last-child::after{left:-16px}
  .step{grid-template-columns:44px 1fr;gap:10px}
  .step:not(:last-child)::after{left:21px}
  .step .range{font-size:10.5px}
  table{display:block;overflow-x:auto}
}
@media print{
  .topbar{position:static;box-shadow:none}
  .nav{display:none}
  body{background:#fff}
  .node,.step,.toulmin,.card{break-inside:avoid}
  li.collapsed>ul{display:block}
  details{display:block}
}
</style>
</head>
<body>
{{BODY}}
<script>
(function(){
  // strength dots
  document.querySelectorAll('.dots[data-score]').forEach(function(d){
    var n=Math.max(0,Math.min(5,parseInt(d.getAttribute('data-score'),10)||0));
    d.textContent='●'.repeat(n)+'○'.repeat(5-n);d.setAttribute('aria-label','強度 '+n+'/5');
  });
  // collapsible argument map
  document.querySelectorAll('.tree li').forEach(function(li){
    var node=li.querySelector(':scope>.node'),kids=li.querySelector(':scope>ul');
    if(node&&kids){node.classList.add('has-kids');node.title='點擊展開／收合';
      node.addEventListener('click',function(e){if(e.target.closest('a'))return;li.classList.toggle('collapsed')})}
  });
  // active nav link
  var links=[].slice.call(document.querySelectorAll('.nav a[href^="#"]'));
  if('IntersectionObserver' in window&&links.length){
    var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+en.target.id)})}})},{rootMargin:'-30% 0px -60% 0px'});
    links.forEach(function(a){var s=document.querySelector(a.getAttribute('href'));if(s)io.observe(s)});
  }
})();
</script>
</body>
</html>
